<!DOCTYPE html>
<html lang="en" class="pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ff">
  <meta http-equiv="Accept-CH" content="Sec-CH-UA-Mobile">
  <meta name="decagon-document" content="app">
  <meta name="decagon-surface" content="">
  <title>Decagon Health</title>
  <style>html.pending body { visibility: hidden; }</style>
  <script src="surface.js"></script>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="mark" aria-hidden="true"></span>
      <div class="who">
        <b>Decagon Health</b>
        <span id="plan">Jordan Rivera</span>
      </div>
      <button class="chat-btn" id="open-chat" type="button">Chat</button>
    </header>
    <main id="main"></main>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
  <div class="chat" id="chat" hidden>
    <header class="chat-top">
      <button class="back" id="close-chat" type="button">Back</button>
      <b>Chat</b>
    </header>
    <iframe id="chat-frame" title="Chat with Decagon Health" referrerpolicy="no-referrer"></iframe>
  </div>
  <script src="app.js"></script>
</body>
</html>
